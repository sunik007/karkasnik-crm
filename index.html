<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Каркасник CRM</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">КАРКАСНИК</div>
      <h1>CRM</h1>
    </div>
    <button class="icon-btn" id="resetBtn" title="Очистить демо-данные">↻</button>
  </header>

  <main class="container">
    <section id="dashboard" class="view active">
      <div class="hero">
        <p>Управление строительством</p>
        <h2>Все клиенты и заказы в одном месте</h2>
      </div>
      <div class="stats">
        <div class="stat"><span>Клиенты</span><strong id="statClients">0</strong></div>
        <div class="stat"><span>Заказы</span><strong id="statOrders">0</strong></div>
        <div class="stat"><span>В работе</span><strong id="statActive">0</strong></div>
        <div class="stat"><span>Сумма</span><strong id="statRevenue">0 ₽</strong></div>
      </div>
      <div class="quick-actions">
        <button class="primary" data-open="clientModal">+ Новый клиент</button>
        <button class="secondary" data-open="orderModal">+ Новый заказ</button>
      </div>
      <section class="panel">
        <div class="section-head"><h3>Последние заказы</h3></div>
        <div id="recentOrders" class="cards"></div>
      </section>
    </section>

    <section id="clients" class="view">
      <div class="section-head"><h2>Клиенты</h2><button class="small primary" data-open="clientModal">+ Добавить</button></div>
      <input class="search" id="clientSearch" placeholder="Поиск по имени, телефону, городу" />
      <div id="clientList" class="cards"></div>
    </section>

    <section id="orders" class="view">
      <div class="section-head"><h2>Заказы</h2><button class="small primary" data-open="orderModal">+ Добавить</button></div>
      <input class="search" id="orderSearch" placeholder="Поиск по клиенту, размеру, статусу" />
      <div id="orderList" class="cards"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="dashboard">⌂<span>Главная</span></button>
    <button class="nav-btn" data-view="clients">👤<span>Клиенты</span></button>
    <button class="nav-btn" data-view="orders">▣<span>Заказы</span></button>
  </nav>

  <dialog id="clientModal" class="modal">
    <form id="clientForm" method="dialog">
      <div class="modal-head"><h3>Новый клиент</h3><button type="button" class="close">×</button></div>
      <label>Имя<input name="name" required /></label>
      <label>Телефон<input name="phone" type="tel" required /></label>
      <label>WhatsApp / Telegram<input name="messenger" /></label>
      <label>Город<input name="city" /></label>
      <label>Адрес строительства<input name="address" /></label>
      <label>Откуда пришёл клиент<select name="source"><option>Авито</option><option>Instagram</option><option>Рекомендация</option><option>Сайт</option><option>Другое</option></select></label>
      <label>Дата обращения<input name="date" type="date" /></label>
      <label>Комментарий<textarea name="comment" rows="3"></textarea></label>
      <button class="primary full" type="submit">Сохранить клиента</button>
    </form>
  </dialog>

  <dialog id="orderModal" class="modal">
    <form id="orderForm" method="dialog">
      <div class="modal-head"><h3>Новый заказ</h3><button type="button" class="close">×</button></div>
      <label>Клиент<select name="clientId" id="orderClient" required></select></label>
      <div class="grid2"><label>Размер дома<input name="size" placeholder="8×10" /></label><label>Площадь, м²<input name="area" type="number" min="0" /></label></div>
      <label>Комплектация<select name="package"><option>Эконом</option><option>Тёплый контур</option><option>Под ключ</option><option>Индивидуальная</option></select></label>
      <div class="grid2"><label>Стоимость, ₽<input name="price" type="number" min="0" /></label><label>Предоплата, ₽<input name="prepayment" type="number" min="0" /></label></div>
      <label>Статус<select name="status"><option>Новый</option><option>Расчёт</option><option>Договор</option><option>В работе</option><option>Завершён</option><option>Отказ</option></select></label>
      <div class="grid2"><label>Начало<input name="startDate" type="date" /></label><label>Срок сдачи<input name="deadline" type="date" /></label></div>
      <label>Комментарий<textarea name="comment" rows="3"></textarea></label>
      <button class="primary full" type="submit">Сохранить заказ</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
